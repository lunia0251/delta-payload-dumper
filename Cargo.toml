[package]
name = "delta-payload-dumper"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
brotli-decompressor = "6.0.1"
bzip2 = "0.6.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
indicatif = "0.18.6"
liblzma = "0.4.8"
memmap2 = "0.9.11"
prost = "0.14.4"
rayon = "1.12.0"
sha1 = "0.11.0"
sha2 = "0.11.0"
tempfile = "3.27.0"
zip = { version = "9.0.0", default-features = false }

[dev-dependencies]
flate2 = "1.1.10"
